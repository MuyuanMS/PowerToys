trigger: none
pr: none

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

# Expose all of these parameters for user configuration.
parameters:
  - name: publishSymbolsToPublic
    displayName: "Publish Symbols to **PUBLIC** (use only for Final Builds)"
    type: boolean
    default: false

  - name: versionNumber
    displayName: "Version Override (optional; main and stable default to the release-train version)"
    type: string
    default: ''

  - name: buildConfigurations
    displayName: "Build Configurations"
    type: object
    default:
      - Release

  - name: buildPlatforms
    displayName: "Build Platforms"
    type: object
    default:
      - x64
      - arm64

  - name: useVSPreview
    type: boolean
    displayName: "Build Using Visual Studio Preview"
    default: false

name: $(BuildDefinitionName)_$(date:yyMM).$(date:dd)$(rev:rrr)

variables:
  - template: templates/variables-nuget-package-version.yml
  - name: versionDate
    value: $[format('{0:yyyyMMdd}', pipeline.startTime)]
  - ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/stable')) }}:
    - name: dailyVersionSequence
      value: $[counter(format('release-{0:yyyyMMdd}', pipeline.startTime), 1)]
  - ${{ else }}:
    - name: dailyVersionSequence
      value: 0

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    customBuildTags:
    - 1ES.PT.ViaStartRight
    pool:
      name: SHINE-INT-S
      ${{ if eq(parameters.useVSPreview, true) }}:
        demands: ImageOverride -equals SHINE-VS18-Preview
      ${{ else }}:
        demands: ImageOverride -equals SHINE-VS18-Latest
      os: windows
    sdl:
      tsa:
        enabled: true
        configFile: '$(Build.SourcesDirectory)\.pipelines\tsa.json'
      binskim:
        enabled: true
        # Exclude every dll/exe in tests/*, as well as all msdia*, covrun* and vcruntime*
        analyzeTargetGlob: +:file|$(Build.ArtifactStagingDirectory)/**/*.dll;+:file|$(Build.ArtifactStagingDirectory)/**/*.exe;-:file:regex|tests.*\.(dll|exe)$;-:file:regex|(covrun.*)\.dll$;-:file:regex|(msdia.*)\.dll$;-:file:regex|(vcruntime.*)\.dll$

    stages:
      - stage: Build
        displayName: Build
        dependsOn: []
        jobs:
          - template: .pipelines/v2/templates/job-build-project.yml@self
            parameters:
              pool:
                name: SHINE-INT-L
                demands:
                  # Our INT agents have a large disk mounted at P:\
                  - ${{ if eq(parameters.useVSPreview, true) }}:
                    - ImageOverride -equals SHINE-VS18-Latest-Preview
                  - ${{ else }}:
                    - ImageOverride -equals SHINE-VS18-Latest
                os: windows
              variables:
                IsPipeline: 1 # The installer uses this to detect whether it should pick up localizations
                SkipCppCodeAnalysis: 1 # Skip the code analysis to speed up release CI. It runs on PR CI, anyway
                # IsExperimentationLive: 1 # The build and installer use this to turn on experimentation
              buildPlatforms: ${{ parameters.buildPlatforms }}
              buildConfigurations: ${{ parameters.buildConfigurations }}
              versionNumber: ${{ parameters.versionNumber }}
              publishArtifacts: false # 1ES PT handles publication for us.
              official: true
              codeSign: true
              runTests: false
              buildTests: false
              signingIdentity:
                serviceName: $(SigningServiceName)
                appId: $(SigningAppId)
                tenantId: $(SigningTenantId)
                akvName: $(SigningAKVName)
                authCertName: $(SigningAuthCertName)
                signCertName: $(SigningSignCertName)
                useManagedIdentity: $(SigningUseManagedIdentity)
                clientId: $(SigningOriginalClientId)
              # Have msbuild use the release nuget config profile
              additionalBuildOptions: /p:RestoreConfigFile="$(Build.SourcesDirectory)\.pipelines\release-nuget.config" /p:EnableCmdPalAOT=true
              beforeBuildSteps:
                # Install the Terrapin retrieval tool, which replaces vcpkg's download handler
                # to redirect it to a safe Microsoft-controlled location
                - template: .pipelines/v2/templates/steps-install-terrapin.yml@self

                # Sets versions for all PowerToy created DLLs
                - pwsh: |-
                    $metadata = .pipelines/resolveBuildMetadata.ps1 `
                      -VersionOverride '${{ parameters.versionNumber }}' `
                      -BuildDate '$(versionDate)' `
                      -DailyVersionSequence '$(dailyVersionSequence)'
                    $publishSymbolsToPublic = $${{ parameters.publishSymbolsToPublic }}
                    if ($publishSymbolsToPublic -and -not $metadata.AllowPublicSymbols) {
                      throw "Public symbols are only supported for manually queued stable-branch releases"
                    }

                    .pipelines/versionSetting.ps1 -versionNumber $metadata.Version -DevEnvironment '' -Channel $metadata.Channel
                    [xml]$versionProps = Get-Content 'src\Version.props'
                    $resolvedVersion = [string]$versionProps.Project.PropertyGroup.Version
                    Write-Host "Resolved PowerToys version: $resolvedVersion"
                    Write-Host "##vso[task.setvariable variable=ResolvedVersionNumber;isOutput=true]$resolvedVersion"
                    Write-Host "##vso[task.setvariable variable=EffectiveVersionNumber;isOutput=true]$resolvedVersion"
                    Write-Host "##vso[task.setvariable variable=ResolvedReleaseChannel;isOutput=true]$($metadata.Channel)"
                    Write-Host "##vso[task.setvariable variable=ResolvedBuildIntent;isOutput=true]$($metadata.Intent)"
                    Write-Host "##vso[task.setvariable variable=ShouldPublishPreview;isOutput=true]$($metadata.ShouldPublishPreview)"
                  name: resolveVersion
                  displayName: Prepare versioning

                # Prepare the localizations and telemetry config before the release build
                - template: .pipelines/v2/templates/steps-fetch-and-prepare-localizations.yml@self

                - pwsh: |-
                    $ErrorActionPreference = 'Stop'
                    $PSNativeCommandUseErrorActionPreference = $true
                    & nuget.exe restore -configFile .pipelines/release-nuget.config -PackagesDirectory . .pipelines/packages.config
                    Move-Item -Force -Verbose "Microsoft.PowerToys.Telemetry.*\build\include\TraceLoggingDefines.h" "src\common\Telemetry\TraceLoggingDefines.h"
                    Move-Item -Force -Verbose "Microsoft.PowerToys.Telemetry.*\build\include\TelemetryBase.cs" "src\common\Telemetry\TelemetryBase.cs"
                  displayName: Emplace telemetry files

      - stage: PublishPreview
        displayName: Publish preview release
        dependsOn: Build
        condition: and(succeeded(), eq(stageDependencies.Build.Build.outputs['resolveVersion.ShouldPublishPreview'], 'True'))
        variables:
          ResolvedVersionNumber: $[ stageDependencies.Build.Build.outputs['resolveVersion.ResolvedVersionNumber'] ]
        jobs:
          - job: PublishPreview
            pool:
              name: SHINE-INT-L
              os: windows
            steps:
              - download: current
                artifact: build-x64-Release
              - download: current
                artifact: build-arm64-Release
              - pwsh: |-
                  $ErrorActionPreference = 'Stop'
                  $releaseFolder = Join-Path '$(Pipeline.Workspace)' 'preview-release'
                  New-Item -ItemType Directory -Path $releaseFolder -Force | Out-Null
                  Get-ChildItem -Path '$(Pipeline.Workspace)\build-x64-Release', '$(Pipeline.Workspace)\build-arm64-Release' -Recurse -File |
                    Copy-Item -Destination $releaseFolder -Force

                  foreach ($architecture in @('x64', 'arm64')) {
                    $symbolDirectory = Get-ChildItem -Path '$(Pipeline.Workspace)\build-' + $architecture + '-Release' -Directory -Filter "symbols-$architecture" -Recurse |
                      Select-Object -First 1
                    if (-not $symbolDirectory) {
                      throw "Could not find symbols-$architecture in the build artifact."
                    }

                    Compress-Archive -Path (Join-Path $symbolDirectory.FullName '*') `
                      -DestinationPath (Join-Path $releaseFolder "symbols-$architecture.zip") -Force
                  }

                  $version = '$(ResolvedVersionNumber)'
                  @"
                  [ptUserX64]: https://github.com/microsoft/PowerToys/releases/download/v$version-preview/PowerToysUserSetup-$version-x64.exe
                  [ptUserArm64]: https://github.com/microsoft/PowerToys/releases/download/v$version-preview/PowerToysUserSetup-$version-arm64.exe
                  [ptMachineX64]: https://github.com/microsoft/PowerToys/releases/download/v$version-preview/PowerToysSetup-$version-x64.exe
                  [ptMachineArm64]: https://github.com/microsoft/PowerToys/releases/download/v$version-preview/PowerToysSetup-$version-arm64.exe
                  "@ | Set-Content (Join-Path $releaseFolder 'release-notes.md')

                  if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
                    throw 'GH_TOKEN must be configured as a secret pipeline variable for preview publication.'
                  }
                  $env:GH_TOKEN | gh auth login --with-token
                  & .github/skills/release-note-generation/scripts/create-github-draft-release.ps1 `
                    -ReleaseFolder $releaseFolder `
                    -GitHubRepo microsoft/PowerToys `
                    -TagName "v$version-preview" `
                    -Target '$(Build.SourceVersion)' `
                    -Prerelease `
                    -LatestFalse `
                    -Publish
                displayName: Create preview GitHub release

      - stage: Build_SDK
        displayName: Build SDK
        dependsOn: []
        jobs:
          - template: .pipelines/v2/templates/job-build-sdk.yml@self
            parameters:
              pool:
                name: SHINE-INT-L
                os: windows
              official: true
              codeSign: true
              signingIdentity:
                serviceName: $(SigningServiceName)
                appId: $(SigningAppId)
                tenantId: $(SigningTenantId)
                akvName: $(SigningAKVName)
                authCertName: $(SigningAuthCertName)
                signCertName: $(SigningSignCertName)
                useManagedIdentity: $(SigningUseManagedIdentity)
                clientId: $(SigningOriginalClientId)
              beforeBuildSteps:
                # Install the Terrapin retrieval tool, which replaces vcpkg's download handler
                # to redirect it to a safe Microsoft-controlled location
                - template: .pipelines/v2/templates/steps-install-terrapin.yml@self

      - stage: Publish
        displayName: Publish
        dependsOn: [Build]
        jobs:
          - template: .pipelines/v2/templates/job-publish-symbols-using-symbolrequestprod-api.yml@self
            parameters:
              versionNumber: ${{ parameters.versionNumber }}
              includePublicSymbolServer: ${{ parameters.publishSymbolsToPublic }}
              ${{ if ne(parameters.publishSymbolsToPublic, true) }}:
                symbolExpiryTime: 10 # For private builds, expire symbols within 10 days. The default is 100 years.
              subscription: $(SymbolPublishingServiceConnection)
              symbolProject: $(SymbolPublishingProject)
