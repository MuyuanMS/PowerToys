name: Command Palette TypeScript SDK

on:
  pull_request:
    paths:
      - 'src/modules/cmdpal/ts-sdk/**'
      - '.github/workflows/cmdpal-ts-sdk.yml'

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/modules/cmdpal/ts-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/modules/cmdpal/ts-sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate SDK
        run: npm run check

      - name: Verify package contents
        run: npm run build && npm run verify:pack
